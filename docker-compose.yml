services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-list-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todolist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todolist}
      POSTGRES_DB: ${POSTGRES_DB:-todolist}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todolist}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
